name: Optimize THV website photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thv-web-optimization.yml'
      - 'optimize_web_assets.py'
permissions:
  contents: write
concurrency:
  group: thv-web-optimization
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "Pillow>=10,<12"
      - name: Build responsive local WebP images
        run: python optimize_web_assets.py
      - name: Publish optimized photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets performance-report.json '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize THV responsive images and local delivery"
          git pull --rebase origin main
          git push origin HEAD:main
