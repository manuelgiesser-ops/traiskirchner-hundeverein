name: Test THV Vereinsbereich
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'verein-core.php'
      - 'vereinsbereich.php'
      - 'vereinsdaten.php'
      - 'vereinsartikel.php'
      - 'studio-*.php'
      - 'website-*.php'
      - 'vereins-backup.php'
      - 'studio-manifest.json'
      - 'tests/portal_test.py'
      - '.github/workflows/thv-portal-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          for file in *.php; do php -l "$file" || exit 1; done
      - name: Isolated access and publishing tests
        run: python3 tests/portal_test.py
