name: Prepare original THV photo assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thv-photo-assets.yml'
      - 'prepare_photo_assets.py'
      - 'assets.json'
permissions:
  contents: write
concurrency:
  group: thv-photo-assets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local image analysis and masking
        run: pip install "numpy<2" "opencv-python-headless==4.10.0.84" "Pillow>=10,<12" "requests>=2.32,<3" "rembg[cpu]==2.0.65"
      - name: Generate the cutout and portrait focal points
        run: python prepare_photo_assets.py
      - name: Commit generated assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-media
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare original dog cutout and trainer focal points"
          git pull --rebase origin main
          git push origin HEAD:main
