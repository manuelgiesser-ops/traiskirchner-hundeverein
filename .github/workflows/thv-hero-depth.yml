name: Prepare THV hero depth layers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thv-hero-depth.yml'
      - 'prepare_hero_depth.py'
permissions:
  contents: write
concurrency:
  group: thv-hero-depth
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing
        run: pip install "numpy<2" "opencv-python-headless==4.10.0.84" "Pillow>=10,<12" "requests>=2.32,<3" "rembg[cpu]==2.0.65"
      - name: Separate moving subject and blurred environment
        run: python prepare_hero_depth.py
      - name: Publish aligned layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-media/hero-depth-background.webp generated-media/hero-depth-dog.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare original hero photograph depth layers"
          git pull --rebase origin main
          git push origin HEAD:main
